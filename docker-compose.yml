services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: greencorridor-backend
    env_file:
      - .env
    environment:
      # Reach MySQL on the host machine (not a MySQL container)
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3306}
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:${DB_PORT:-3306}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SERVER_PORT: 8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVER_PORT:-8080}:8080"

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: greencorridor-frontend
    depends_on:
      - backend
    environment:
      VITE_API_PROXY: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    # Mobile Flutter app is intentionally not included in this stack.
    # Database: local MySQL on the host (see DB_* in .env). No MySQL image.
