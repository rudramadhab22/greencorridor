services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: greencorridor-postgres
    environment:
      POSTGRES_DB: greencorridor
      POSTGRES_USER: greencorridor
      POSTGRES_PASSWORD: greencorridor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencorridor -d greencorridor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Placeholders for supporting engines (wired up in later iterations)
  # osrm:
  # sumo:

volumes:
  postgres_data:
